<script src="../js/kare.js"></script>
<script>
if (!kareGuard(['admin'])) throw '';
let alertCoaches = [];

(async () => {
  alertCoaches = await kareApi('GET', '/admin/coaches/alerts') || [];
  const tbody = document.getElementById('alerts-tbody');
  if (alertCoaches.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-success text-center py-3">Tüm koçlar bu hafta görüşme girdi</td></tr>';
    return;
  }
  tbody.innerHTML = alertCoaches.map(c => {
    const u = c.user || {};
    return `<tr><td>${u.name||''} ${u.surname||''}</td><td>${u.city||'–'}</td><td>${u.phone||'–'}</td>
    <td><button class="btn btn-sm btn-outline-warning" onclick="sendOne('${u.phone}')">SMS Gönder</button></td></tr>`;
  }).join('');
})();

async function sendOne(phone) {
  const r = await kareApi('POST', '/admin/sms/send', { phone, message: 'KARE: Bu hafta görüşme notunuzu girmediniz. Lütfen sisteme giriniz.', type: 'alert' });
  if (r) kareToast('SMS gönderildi');
}

async function sendBulk() {
  if (alertCoaches.length === 0) { kareToast('Uyarı listesi boş', 'warning'); return; }
  for (const c of alertCoaches) {
    if (c.user?.phone) await kareApi('POST', '/admin/sms/send', { phone: c.user.phone, message: 'KARE: Bu hafta görüşme notunuzu girmediniz. Lütfen sisteme giriniz.', type: 'alert' });
  }
  kareToast(`${alertCoaches.length} koça SMS gönderildi`);
}
</script>
