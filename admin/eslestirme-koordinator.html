                <div class="card-header d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Öğrenciler</h5>
                  <div class="d-flex gap-2">

                      <option value="">Tüm iller</option>

                      <thead><tr><th style="width:40px"></th><th>Öğrenci</th><th>İl</th><th>Durum</th></tr></thead>

                    <option value="">Yükleniyor...</option>

                    <i class="ti tabler-building me-2"></i>Toplu Eşleştir
                  </button>

<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/jquery/jquery.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/popper/popper.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/js/bootstrap.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/node-waves/node-waves.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/hammer/hammer.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/js/menu.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/js/main.js"></script>
<script src="../js/kare.js"></script>
<script>
if (!kareGuard(['admin'])) throw '';

async function loadStudents() {
  const city = document.getElementById('city-filter').value;
  const path = '/admin/matching/students' + (city ? '?city=' + encodeURIComponent(city) : '');
  const tbody = document.getElementById('students-tbody');
  tbody.innerHTML = kareSkeleton(4, 6);
  const data = await kareApi('GET', path) || [];
  if (data.length === 0) {
    tbody.innerHTML = kareEmptyState('tabler-database-off', 'Kayıt bulunamadı', 'Öğrenci bulunamadı');
    return;
  }
  tbody.innerHTML = data.map(s => `
    <tr>
      <td><input type="checkbox" class="form-check-input student-chk" value="${s.id}"></td>
      <td>${s.user?.name || ''} ${s.user?.surname || ''}</td>
      <td>${s.user?.city || '–'}</td>
      <td>${kareBadge(s.registration_status)}</td>
    </tr>`).join('');
  updateInfo();
  document.querySelectorAll('.student-chk').forEach(c => c.addEventListener('change', updateInfo));
}

function updateInfo() {
  const count = document.querySelectorAll('.student-chk:checked').length;
  document.getElementById('match-info').textContent = count + ' öğrenci seçildi.';
}

function toggleAll() {
  const chks = document.querySelectorAll('.student-chk');
  const anyUnchecked = [...chks].some(c => !c.checked);
  chks.forEach(c => c.checked = anyUnchecked);
  updateInfo();
}

async function loadCoordinators() {
  const coords = await kareApi('GET', '/admin/coordinators') || [];
  const sel = document.getElementById('coord-select');
  if (coords.length === 0) { sel.innerHTML = '<option value="">Koordinatör yok</option>'; return; }
  sel.innerHTML = '<option value="">Koordinatör seçin...</option>' +
    coords.map(coord =>
      `<option value="${coord.id}">${coord.user?.name || ''} ${coord.user?.surname || ''} — ${coord.organization || '–'}</option>`
    ).join('');
}

async function doMatch() {
  const coordID = parseInt(document.getElementById('coord-select').value);
  if (!coordID) { kareToast('Lütfen bir koordinatör seçin', 'warning'); return; }
  const studentIDs = [...document.querySelectorAll('.student-chk:checked')].map(c => parseInt(c.value));
  if (studentIDs.length === 0) { kareToast('Lütfen en az bir öğrenci seçin', 'warning'); return; }
  const r = await kareApi('POST', '/admin/matching/coordinator', { coordinator_id: coordID, student_ids: studentIDs });
  if (r) { kareToast(studentIDs.length + ' öğrenci eşleştirildi'); loadStudents(); }
}

(async () => {
  await Promise.all([loadStudents(), loadCoordinators()]);
})();
</script>
