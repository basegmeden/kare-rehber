<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/jquery/jquery.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/popper/popper.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/js/bootstrap.js"></script>

<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>

<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/js/main.js"></script>
<script src="../js/kare.js"></script>
<script>
if (!kareGuard(['koc'])) throw '';
const me = kareCurrentUser();

async function loadMessages() {
  const data = await kareApi('GET', '/coach/messages') || [];
  const list = document.getElementById('messages-list');
  if (data.length === 0) { list.innerHTML = '<p class="text-muted text-center">Mesaj yok</p>'; return; }
  list.innerHTML = data.map(m => {
    const mine = m.sender_id === me?.id;
    const sender = m.sender ? `${m.sender.name} ${m.sender.surname}` : 'Sistem';
    const d = new Date(m.created_at).toLocaleString('tr-TR');
    return `<div class="mb-3 ${mine ? 'text-end' : ''}">
      <small class="text-muted">${sender} · ${d}</small>
      <div class="d-inline-block p-2 rounded ${mine ? 'bg-label-primary' : 'bg-label-secondary'} mt-1">${m.body}</div>
    </div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

async function sendMsg() {
  const recipientID = parseInt(document.getElementById('inp-recipient').value);
  const body = document.getElementById('inp-body').value.trim();
  if (!recipientID || !body) { kareToast('Alıcı ve mesaj gerekli', 'warning'); return; }
  const r = await kareApi('POST', '/coach/messages', { recipient_id: recipientID, body });
  if (r) { document.getElementById('inp-body').value = ''; kareToast('Mesaj gönderildi'); loadMessages(); }
}

loadMessages();
</script>
