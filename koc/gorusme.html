<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/jquery/jquery.js"></script>
<script src="https://demos.pixinvent.com/vuexy-html-admin-template/assets/vendor/libs/popper/popper.js"></script>

<script>
if (!kareGuard(['koc'])) throw '';

const CATEGORIES = [
  'Çalışma Stili',
  'Motivasyon Durumu',
  'Hedefler ve Başarı Durumu',
  'Gelişim Serüveni',
  'Ders Bazlı Gelişim',
  'Hizmet Şuuru (vakıf ile irtibat, muhabbet, gidiş geliş)',
];

function updateMeetingProgress() {
  const filled = CATEGORIES.filter((_, i) => {
    const notes = (document.getElementById('notes-' + i)?.value || '').trim();
    const stars = parseInt(document.getElementById('stars-' + i)?.dataset.val || '0');
    return notes.length > 0 || stars > 0;
  }).length;
  const pct = Math.round((filled / CATEGORIES.length) * 100);
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = filled + ' / ' + CATEGORIES.length + ' dolduruldu';
  const bar = document.getElementById('prog-bar');
  bar.className = 'progress-bar ' + (pct === 100 ? 'bg-success' : pct >= 50 ? 'bg-primary' : 'bg-warning');
}

// Kategori kartlarını oluştur
function buildCategories() {
  const grid = document.getElementById('categories-grid');
  grid.innerHTML = CATEGORIES.map((name, i) => `
    <div class="col-md-6">
      <div class="category-card h-100">
        <div class="category-title">${name}</div>
        <div class="star-group" id="stars-${i}" data-val="0">
          ${[1,2,3,4,5].map(v => `<span class="star" data-v="${v}" data-idx="${i}">★</span>`).join('')}
        </div>
        <div class="geri-bildirim-label">Geri Bildirim</div>
        <textarea id="notes-${i}" class="form-control" rows="3" placeholder="Öğrenci hakkında geri bildirim..."></textarea>
      </div>
    </div>
  `).join('');

  // Yıldız tıklama
  document.querySelectorAll('.star').forEach(star => {
    star.addEventListener('click', () => {
      const idx = star.dataset.idx;
      const val = parseInt(star.dataset.v);
      const group = document.getElementById('stars-' + idx);
      group.dataset.val = val;
      group.querySelectorAll('.star').forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.v) <= val);
      });
      updateMeetingProgress();
    });
    star.addEventListener('mouseover', () => {
      const idx = star.dataset.idx;
      const val = parseInt(star.dataset.v);
      document.getElementById('stars-' + idx).querySelectorAll('.star').forEach(s => {
        s.style.color = parseInt(s.dataset.v) <= val ? '#ff9f43' : '';
      });
    });
    star.addEventListener('mouseout', () => {
      const idx = star.dataset.idx;
      const group = document.getElementById('stars-' + idx);
      const current = parseInt(group.dataset.val);
      group.querySelectorAll('.star').forEach(s => {
        s.style.color = '';
        s.classList.toggle('active', parseInt(s.dataset.v) <= current);
      });
    });
  });

  // Textarea değişimde ilerlemeyi güncelle
  document.querySelectorAll('[id^="notes-"]').forEach(ta => {
    ta.addEventListener('input', updateMeetingProgress);
  });

  updateMeetingProgress();
}

function getCategoryData() {
  return CATEGORIES.map((name, i) => ({
    name,
    rating: parseInt(document.getElementById('stars-' + i).dataset.val) || 1,
    notes: document.getElementById('notes-' + i).value.trim(),
  }));
}

async function saveMeeting(sendToAdmin) {
  const selStudent = document.getElementById('sel-student');
  const selWeek = document.getElementById('sel-week');
  const studentID = parseInt(selStudent.value);
  const weekID = parseInt(selWeek.value);
  let valid = true;
  if (!studentID) { kareMarkInvalid(selStudent, 'Lütfen bir öğrenci seçin'); valid = false; }
  else kareClearInvalid(selStudent);
  if (!weekID) { kareMarkInvalid(selWeek, 'Lütfen bir hafta seçin'); valid = false; }
  else kareClearInvalid(selWeek);
  if (!valid) return;

  const categories = getCategoryData();
  const hasNotes = categories.some(c => c.notes.length > 0);
  if (!hasNotes && sendToAdmin) { kareToast('En az bir kategori için not giriniz', 'warning'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  const payload = {
    student_id: studentID,
    week_id: weekID,
    categories,
    notes: categories.map(c => `${c.name}: ${c.notes}`).filter(t => t.slice(-1) !== ':').join('\n\n'),
  };

  const r = await kareApi('POST', '/coach/meetings', payload);
  if (r) {
    kareToast(sendToAdmin ? 'Değerlendirme gönderildi ✓' : 'Kaydedildi');
    if (sendToAdmin) {
      // Reset form
      document.getElementById('sel-student').value = '';
      document.getElementById('sel-week').value = '';
      buildCategories();
    }
  }
  btn.disabled = false;
}

function exportPDF() {
  const student = document.getElementById('sel-student');
  const week = document.getElementById('sel-week');
  const studentName = student.options[student.selectedIndex]?.text || 'Öğrenci';
  const weekLabel = week.options[week.selectedIndex]?.text || 'Hafta';
  document.title = `${studentName} — ${weekLabel} — Değerlendirme`;
  window.print();
}

(async () => {
  buildCategories();

  const [weeksData, studentsData] = await Promise.all([
    kareApi('GET', '/coach/weeks'),
    kareApi('GET', '/coach/students'),
  ]);

  document.getElementById('sel-student').addEventListener('change', e => kareClearInvalid(e.target));
  document.getElementById('sel-week').addEventListener('change', e => kareClearInvalid(e.target));

  const selWeek = document.getElementById('sel-week');
  if (weeksData && weeksData.length > 0) {
    selWeek.innerHTML = '<option value="">Hafta seçiniz...</option>' +
      weeksData.map(w => `<option value="${w.id}">${w.label}</option>`).join('');
    selWeek.value = weeksData[0].id; // aktif hafta varsayılan
  }

  const selStudent = document.getElementById('sel-student');
  if (studentsData && studentsData.length > 0) {
    selStudent.innerHTML = '<option value="">Öğrenci seçiniz...</option>' +
      studentsData.map(a => {
        const u = a.student?.user || {};
        return `<option value="${a.student_id}">${u.name || ''} ${u.surname || ''}</option>`;
      }).join('');
  } else {
    selStudent.innerHTML = '<option value="">Atanmış öğrenci yok</option>';
  }
})();
</script>
