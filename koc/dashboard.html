<script src="../js/kare.js"></script>
<script>
if (!kareGuard(['koc'])) throw '';
(async () => {
  const [weeksData, studentsData, meetingsData] = await Promise.all([
    kareApi('GET', '/coach/weeks'),
    kareApi('GET', '/coach/students'),
    kareApi('GET', '/coach/meetings'),
  ]);
  if (weeksData && weeksData.length > 0) {
    const aw = weeksData[0];
    document.getElementById('active-week-alert').innerHTML =
      `Aktif hafta: <strong>${aw.label}</strong>. En fazla bir önceki haftada işlem yapabilirsiniz.`;
  }
  const total = studentsData ? studentsData.length : 0;
  document.getElementById('stat-students').textContent = total;
  if (meetingsData && weeksData && weeksData.length > 0) {
    const activeWeekId = weeksData[0].id;
    const thisDone = meetingsData.filter(m => m.week_id === activeWeekId).length;
    document.getElementById('stat-done').textContent = thisDone;
    document.getElementById('stat-missing').textContent = Math.max(0, total - thisDone);
  }
})();
</script>
